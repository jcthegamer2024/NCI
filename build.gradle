plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        nexo_client { sourceSet sourceSets.main }
        nci_search_test { sourceSet sourceSets.clientTest }
    }
    runs {
        searchTest {
            client()
            source sourceSets.clientTest
            runDir 'build/search-test-run'
            vmArg '-Dfabric.client.gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

def releaseJarBaseName = "NCI-v${project.mod_version}-${project.minecraft_version}"

tasks.named("jar") {
    archiveFileName = "${releaseJarBaseName}.jar"
}

tasks.named("sourcesJar") {
    archiveFileName = "${releaseJarBaseName}-sources.jar"
}
